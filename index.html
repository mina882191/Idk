<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NYXVEIL HOME</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#050505;
  color:#eee;
  font-family:Arial,sans-serif;
  min-height:100vh;
  overflow-x:hidden;
}
body:before{
  content:"";
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at 20% 35%,rgba(150,0,30,.22),transparent 35%),
    radial-gradient(circle at 80% 70%,rgba(100,0,20,.16),transparent 35%);
  pointer-events:none;
}
header{
  height:110px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 8%;
  border-bottom:1px solid #1d1d1d;
}
.logo{
  font-weight:800;
  letter-spacing:6px;
  font-size:20px;
}
.logo span{color:#b31332}
nav a{
  color:#777;
  text-decoration:none;
  margin-left:32px;
  font-size:13px;
}
main{
  min-height:calc(100vh - 170px);
  display:flex;
  align-items:center;
  padding:8%;
}
.content{max-width:800px}
.small{
  color:#c51d3b;
  letter-spacing:7px;
  font-size:13px;
  font-weight:bold;
}
h1{
  font-size:clamp(42px,7vw,86px);
  margin:15px 0;
  letter-spacing:-3px;
}
p{
  color:#888;
  font-size:18px;
  line-height:1.8;
}
button{
  margin-top:28px;
  padding:17px 27px;
  border:1px solid #a91431;
  background:#99132d;
  color:white;
  font-size:15px;
  cursor:pointer;
  transition:.25s;
}
button:hover{
  background:#c51d3b;
  box-shadow:0 0 35px rgba(190,20,55,.35);
}
#user{
  margin-top:25px;
  display:none;
  align-items:center;
  gap:12px;
  color:#ccc;
}
#avatar{
  width:42px;
  height:42px;
  border-radius:50%;
}
#logout{
  margin-top:15px;
  background:#111;
  border-color:#333;
}
footer{
  padding:25px 8%;
  color:#555;
  border-top:1px solid #151515;
  font-size:13px;
}

/* loading */
#loading{
  position:fixed;
  inset:0;
  z-index:9999;
  background:#050505;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  transition:.5s;
}
.loader{
  width:45px;
  height:45px;
  border:2px solid #351018;
  border-top-color:#c51d3b;
  border-radius:50%;
  animation:spin 1s linear infinite;
}
.loadingText{
  margin-top:18px;
  color:#b31332;
  letter-spacing:5px;
  font-size:11px;
}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>

<body>

<div id="loading">
  <div class="loader"></div>
  <div class="loadingText">NYXVEIL HOME</div>
</div>

<header>
  <div class="logo">NYX<span>VEIL</span> HOME</div>
  <nav>
    <a href="#">SYSTEMS</a>
    <a href="#">ROLES</a>
    <a href="#">JOIN</a>
  </nav>
</header>

<main>
  <div class="content">
    <div class="small">THE NEXT STEP</div>

    <h1>ENTER NYXVEIL HOME</h1>

    <p>
      พื้นที่ชุมชนของ NYXVEIL HOME<br>
      เข้าสู่ระบบด้วย Discord เพื่อเริ่มใช้งานระบบสมาชิก
    </p>

    <button id="login">LOGIN WITH DISCORD</button>

    <div id="user">
      <img id="avatar">
      <span id="username"></span>
    </div>

    <button id="logout" style="display:none">LOGOUT</button>
  </div>
</main>

<footer>
  © 2026 NYXVEIL HOME — Community Platform
</footer>

<script>
const SUPABASE_URL = "https://rsfpzhukmrgubliltkol.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_i1GWMhB02-f30GVZjbtqRA_ADrW5Hk_";

const supabaseClient = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);

const loading = document.getElementById("loading");
const login = document.getElementById("login");
const logout = document.getElementById("logout");
const userBox = document.getElementById("user");
const username = document.getElementById("username");
const avatar = document.getElementById("avatar");

async function showUser(){
  const { data, error } = await supabaseClient.auth.getUser();

  if (error) {
    console.error(error);
    return;
  }

  const user = data.user;

  if (user) {
    const meta = user.user_metadata || {};

    username.textContent =
      meta.full_name ||
      meta.name ||
      meta.preferred_username ||
      "Discord Member";

    if (meta.avatar_url) {
      avatar.src = meta.avatar_url;
    }

    userBox.style.display = "flex";
    login.style.display = "none";
    logout.style.display = "block";
  }

  setTimeout(() => {
    loading.style.opacity = "0";

    setTimeout(() => {
      loading.style.display = "none";
    }, 500);

  }, 500);
}

login.onclick = async () => {
  loading.style.display = "flex";
  loading.style.opacity = "1";

  await supabaseClient.auth.signInWithOAuth({
    provider:"discord",
    options:{
      redirectTo:window.location.origin
    }
  });
};

logout.onclick = async () => {
  loading.style.display = "flex";
  loading.style.opacity = "1";

  await supabaseClient.auth.signOut();
  location.reload();
};

showUser();
</script>

</body>
</html>
